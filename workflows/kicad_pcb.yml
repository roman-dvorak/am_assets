name: Kicad - outputs of one PCB

# Reusable workflow called by kicad_outputs.yml once per PCB design (matrix over PCBs, the output
# types are the jobs inside). Input `pcb` is one entry of the matrix from doc/assets/workflows/pcb_matrix.py:
#   {"name", "dir", "schema", "board", "extra_layers", "out", "sub"}
# Every artifact is suffixed with _<name>; kicad_outputs.yml (UPDATE_REPO) puts them into the repository.

on:
  workflow_call:
    inputs:
      pcb:
        description: "JSON matrix entry of the PCB"
        required: true
        type: string

env:
  dir: "hw/out"
  kibot: "doc/assets/kibot"
  name: ${{ fromJson(inputs.pcb).name }}
  schema: ${{ fromJson(inputs.pcb).schema }}
  board: ${{ fromJson(inputs.pcb).board }}
  out: ${{ fromJson(inputs.pcb).out }}

jobs:
  ERC:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.pat }}
          ref: ${{ github.head_ref }}

      - uses: INTI-CMNB/KiBot@v2_dk10
        with:
          config: ${{ env.kibot }}/erc.kibot.yaml
          schema: ${{ env.schema }}
          board: ${{ env.board }}
          dir: ${{ env.dir }}


  DRC:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.pat }}
          ref: ${{ github.head_ref }}

      - uses: INTI-CMNB/KiBot@v2_dk10
        with:
          config: ${{ env.kibot }}/drc.kibot.yaml
          schema: ${{ env.schema }}
          board: ${{ env.board }}
          dir: ${{ env.dir }}


  schematics:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.pat }}
          ref: ${{ github.head_ref }}

      - uses: INTI-CMNB/KiBot@v2_dk10
        with:
          config: ${{ env.kibot }}/schematics.kibot.yaml
          schema: ${{ env.schema }}
          board: ${{ env.board }}
          dir: ${{ env.dir }}_docs

      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: doc_sch_${{ env.name }}
          path: ${{ env.dir }}_docs/**


  placement:
    name: "Placement and XML"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.pat }}
          ref: ${{ github.head_ref }}

      - uses: INTI-CMNB/KiBot@v2_dk10
        with:
          config: ${{ env.kibot }}/placement.kibot.yaml
          schema: ${{ env.schema }}
          board: ${{ env.board }}
          dir: ${{ env.dir }}_docs

      - uses: INTI-CMNB/KiBot@v2_dk10
        with:
          config: ${{ env.kibot }}/xml.kibot.yaml
          schema: ${{ env.schema }}
          board: ${{ env.board }}
          dir: ${{ env.dir }}_docs

      - name: "Collect files"
        run: |
          mkdir -p doc_xml
          mv ${{ fromJson(inputs.pcb).dir }}/*.xml doc_xml/ || true
          mv ${{ env.dir }}_docs/*.csv doc_xml/ || true

      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: doc_xml_${{ env.name }}
          path: doc_xml

      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: doc_placement_${{ env.name }}
          path: |
            ${{ env.dir }}_docs/**/*.pdf
            ${{ env.dir }}_docs/**/*.svg
            ${{ env.dir }}_docs/**/*.csv


  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.pat }}
          ref: ${{ github.head_ref }}

      - uses: INTI-CMNB/KiBot@v2_dk10
        with:
          config: ${{ env.kibot }}/report.kibot.yaml
          schema: ${{ env.schema }}
          board: ${{ env.board }}
          dir: ${{ env.dir }}_report

      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: doc_report_${{ env.name }}
          path: ${{ env.dir }}_report/


  ibom:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.pat }}
          ref: ${{ github.head_ref }}

      - uses: INTI-CMNB/KiBot@v2_dk10
        with:
          config: ${{ env.kibot }}/ibom.kibot.yaml
          schema: ${{ env.schema }}
          board: ${{ env.board }}
          dir: ${{ env.dir }}_ibom

      - name: "Rename output"
        run: for file in $(find ${{ env.dir }}_ibom -type f); do sudo mv "${file}" "${file//${{ env.name }}/${{ env.out }}}" || true ; done

      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: doc_ibom_${{ env.name }}
          path: ${{ env.dir }}_ibom/


  models-3d:
    name: "3D models (STEP, glTF, renders)"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.pat }}
          ref: ${{ github.head_ref }}

      - uses: INTI-CMNB/KiBot@v2_dk10
        with:
          config: ${{ env.kibot }}/3d.kibot.yaml
          schema: ${{ env.schema }}
          board: ${{ env.board }}
          dir: ${{ env.dir }}_3d
          install3D: YES
          cache3D: YES

      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: hw_3d_${{ env.name }}
          path: ${{ env.dir }}_3d/3d/**


  gerbers:
    name: "Fabrication: Gerbers, Drill and PnP"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.pat }}
          ref: ${{ github.head_ref }}

      - name: "Prepare gerbers config (extra layers)"
        id: gerber_config
        env:
          EXTRA_LAYERS: ${{ toJson(fromJson(inputs.pcb).extra_layers) }}
        run: |
          python3 <<'PYEOF'
          import json, os, yaml
          extra = json.loads(os.environ["EXTRA_LAYERS"] or "[]")
          src = "${{ env.kibot }}/gerbers.kibot.yaml"
          config = src
          if extra:
              with open(src) as f:
                  cfg = yaml.safe_load(f)
              for out in cfg["outputs"]:
                  if out.get("type") == "gerber":
                      out["layers"] += [l for l in extra if l not in out["layers"]]
              config = "${{ env.kibot }}/gerbers.gen.${{ env.name }}.kibot.yaml"
              with open(config, "w") as f:
                  yaml.safe_dump(cfg, f, sort_keys=False)
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh:
              gh.write(f"config={config}\n")
          PYEOF

      - uses: INTI-CMNB/KiBot@v2_dk10
        with:
          config: ${{ steps.gerber_config.outputs.config }}
          schema: ${{ env.schema }}
          board: ${{ env.board }}
          dir: ${{ env.dir }}_gerbers
          verbose: 3

      - name: "Rename output"
        run: for file in $(find ${{ env.dir }}_gerbers -type f); do sudo mv "${file}" "${file//${{ env.name }}/${{ env.out }}}" || true ; done

      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: hw_cam_profi_${{ env.name }}
          path: ${{ env.dir }}_gerbers/gerbers/**


  graphics:
    name: "CAD and render"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.pat }}
          ref: ${{ github.head_ref }}

      - uses: INTI-CMNB/KiBot@v2_dk10
        with:
          config: ${{ env.kibot }}/cad.kibot.yaml
          schema: ${{ env.schema }}
          board: ${{ env.board }}
          dir: ${{ env.dir }}_cad
          install3D: YES
          cache3D: YES

      - uses: INTI-CMNB/KiBot@v2_dk10
        with:
          config: ${{ env.kibot }}/render.kibot.yaml
          schema: ${{ env.schema }}
          board: ${{ env.board }}
          dir: ${{ env.dir }}_img
          install3D: YES
          cache3D: YES
          verbose: 3

      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: doc_cad_${{ env.name }}
          path: ${{ env.dir }}_cad/**

      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: doc_img_${{ env.name }}
          path: ${{ env.dir }}_img/img/**
