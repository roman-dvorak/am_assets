name: Release Assets

# Release convention: one release per hardware revision.
#   tag:   <revision branch>-release   (e.g. AMHATLED01D-release)
#   title: <revision branch>           (e.g. AMHATLED01D)
# The workflow builds the manufacturing data from the tagged commit and attaches to the release
#   <revision>-<short sha>-gerbers.zip   Gerbers and drill files
#   <revision>-<short sha>-assembly.zip  iBOM, KiCad and IPC-D-356 netlists, position CSV
# each with a .sha256 checksum.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild the assets for (e.g. AMHATLED01D-release)"
        required: true

permissions:
  contents: write

env:
  kibot: "doc/assets/kibot"
  dir: "hw/out_release"
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  upload-gerber-assets:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the tagged commit
      uses: actions/checkout@v4
      with:
        ref: refs/tags/${{ env.TAG }}
        submodules: recursive
        token: ${{ secrets.pat }}

    - name: Project name
      run: |
        # repository name without the "-internal" suffix
        p="${GITHUB_REPOSITORY#*/}"; p="${p%-internal}"
        { echo "project=$p"; echo "schema=hw/sch_pcb/$p.kicad_sch"; echo "board=hw/sch_pcb/$p.kicad_pcb"; } >> "$GITHUB_ENV"

    - name: Take the release tooling (doc/assets) from the branch the workflow was run on
      if: github.event_name == 'workflow_dispatch'
      run: |
        git fetch --depth=1 origin ${{ github.sha }}
        git checkout ${{ github.sha }} -- .gitmodules doc/assets
        git submodule sync --recursive
        git submodule update --init --recursive doc/assets

    - name: Generate Gerbers and drill files with KiBot
      uses: INTI-CMNB/KiBot@v2_dk10
      with:
        config: ${{ env.kibot }}/gerbers.kibot.yaml
        schema: ${{ env.schema }}
        board: ${{ env.board }}
        dir: ${{ env.dir }}

    - name: Generate iBOM, netlists and position file with KiBot
      uses: INTI-CMNB/KiBot@v2_dk10
      with:
        config: ${{ env.kibot }}/assembly.kibot.yaml
        schema: ${{ env.schema }}
        board: ${{ env.board }}
        dir: ${{ env.dir }}

    - name: Drop DNP parts from the position file
      run: |
        sudo python3 - "${{ env.dir }}/assembly" <<'EOF'
        import csv, glob, re, sys
        d = sys.argv[1]
        net = open(glob.glob(d + '/*netlist.net')[0]).read()
        dnp = set()
        for comp in re.split(r'\(comp\b', net)[1:]:
            ref = re.search(r'\(ref "([^"]+)"\)', comp)
            if ref and re.search(r'\(property\s*\(name "dnp"\)', comp):
                dnp.add(ref.group(1))
        print('DNP:', ' '.join(sorted(dnp)) or '-')
        for f in glob.glob(d + '/*position.csv'):
            rows = list(csv.reader(open(f)))
            kept = [rows[0]] + [r for r in rows[1:] if r[0] not in dnp]
            csv.writer(open(f, 'w', newline='')).writerows(kept)
            print(f, len(rows) - len(kept), 'rows removed')
        EOF

    - name: Package manufacturing data
      run: |
        VERSION="${TAG%-release}"
        SHA_SHORT=$(git rev-parse --short HEAD)
        SHA_FULL=$(git rev-parse HEAD)

        # package <kind> <source dir>: <version>-<sha>-<kind>.zip with files renamed to the version
        package() {
          local pkg="${VERSION}-${SHA_SHORT}-$1"
          mkdir -p "pkg/${pkg}"
          for f in "$2"/*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            cp "$f" "pkg/${pkg}/${name/#${{ env.project }}/${VERSION}}"
          done
          printf '%s\n' \
            "Project:  ${{ env.project }}" \
            "Version:  ${VERSION}" \
            "Tag:      ${TAG}" \
            "Commit:   ${SHA_FULL}" \
            "Built:    $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > "pkg/${pkg}/BUILD_INFO.txt"
          (cd pkg && zip -r "../${pkg}.zip" "${pkg}")
          sha256sum "${pkg}.zip" > "${pkg}.zip.sha256"
          unzip -l "${pkg}.zip"
          echo "${pkg}.zip ${pkg}.zip.sha256" >> assets.txt
        }

        package gerbers  "${{ env.dir }}/gerbers"
        package assembly "${{ env.dir }}/assembly"

    - name: Upload to the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "$TAG" $(cat assets.txt) --clobber --repo "${{ github.repository }}"
