name: Kicad - production files generator

# Matrix over the PCB designs of the repository (doc/assets/workflows/pcb_matrix.py), every PCB runs
# the reusable workflow kicad_pcb.yml with the individual output jobs (ERC, DRC, schematics, gerbers, ...).
# PCB list: hw/sch_pcb/PCB_matrix.yaml, or hw/sch_pcb/<project>.kicad_pcb (single board, legacy layout),
# or every hw/sch_pcb/<x>/<x>.kicad_pcb.
# Outputs: single board -> doc/gen/, hw/cam_profi/ (as before); more boards -> doc/gen/<name>/, hw/cam_profi/<name>/.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - '**.kicad_pcb'
      - '**.kicad_sch'
      - '**.kicad_pro'
      - '**.yml'
      - '**.yaml'
      - 'doc/assets'
  workflow_dispatch:

jobs:
  discover:
    name: "Find PCB designs"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.pat }}
          ref: ${{ github.head_ref }}

      - id: set-matrix
        run: python3 doc/assets/workflows/pcb_matrix.py --github


  pcb:
    name: "PCB ${{ matrix.name }}"
    needs: [discover]
    strategy:
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
      fail-fast: false
    uses: ./.github/workflows/kicad_pcb.yml
    with:
      pcb: ${{ toJson(matrix) }}
    secrets: inherit


  UPDATE_REPO:
    runs-on: ubuntu-latest
    name: Update repository
    needs: [discover, pcb]
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }}
        token: ${{ secrets.pat }}

    - run: |
        git pull --force --rebase || true
        git submodule update --remote || true

    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Remove old manufacturing data
      run: |
        rm -rf hw/cam_profi || true
        rm -rf doc/gen || true

    - name: Extract to right position
      env:
        MATRIX: ${{ needs.discover.outputs.matrix }}
      run: |
        python3 -c 'import json, os; [print(p["name"], p["sub"] or ".") for p in json.loads(os.environ["MATRIX"])["include"]]' |
        while read -r name sub; do
          [ "$sub" = "." ] && sub=""
          G="doc/gen/${sub}"
          C="hw/cam_profi/${sub}"
          echo "== ${name} -> ${G} ${C}"
          mkdir -p "${G}img" "${C}gbr" "${C}assembly" "${C}ibom" "${C}3d"

          cp -r doc_img_${name}/* "${G}img/" || true
          cp -r doc_cad_${name}/cad/* "${G}" || true
          cp -r hw_cam_profi_${name}/* "${C}gbr/" || true
          cp -r doc_sch_${name}/docs/* "${G}" || true
          cp -r doc_xml_${name}/* "${C}" || true
          cp -r doc_sch_${name}/img/pcb/* "${G}img/" || true
          cp -r doc_placement_${name}/* "${C}assembly/" || true
          cp -r doc_report_${name}/* "${G}" || true
          cp -r doc_ibom_${name}/docs/* "${C}" || true
          cp -r hw_3d_${name}/* "${C}3d/" || true

          mv "${C}gbr/PnP/" "${C}assembly/" || true
        done

        rm -rf doc_img_* doc_cad_* hw_cam_profi_* doc_sch_* doc_placement_* doc_xml_* doc_report_* doc_ibom_* hw_3d_* || true
        git add . -f

    - uses: stefanzweifel/git-auto-commit-action@v4.16.0
      with:
        commit_message: Update actions products
        add_options: '-A -f'
