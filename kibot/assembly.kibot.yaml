kibot:
  version: 1

preflight:
  run_erc: false
  run_drc: false
  check_zone_fills: true

global:
  kiauto_time_out_scale: 15

# JLCPCB assembly: rotation corrections and LCSC filter (from includes/gerbers_jlcpcb.kibot.yaml)
variants:
  - name: jlcpcb_rotated
    comment: "Just a place holder for the rotation filter"
    type: kibom
    variant: jlcpcb_rotated
    pre_transform: jlcpcb_fix_rotation

filters:
  - name: jlcpcb_only_lcsc
    comment: "Only parts with JLC code"
    type: generic
    include_only:
      - column: "LCSC"
        regex: '^C\d+'
  - name: jlcpcb_fix_rotation
    comment: "Adjust rotation for JLC"
    type: rot_footprint
    negative_bottom: true
    # Rotation list from https://github.com/matthewlai/JLCKicadTools/blob/master/jlc_kicad_tools/cpl_rotations_db.csv
    rotations:
      - ["^R_Array_Convex_", 90]
      - ["^R_Array_Concave_", 90]
      - ["^SOT-223", 180]
      - ["^SOT-23", 180]
      - ["^SOT-89", 180]
      - ["^TSOT-23", 180]
      - ["^SOT-353", 180]
      - ["^SOT-363", 180]
      - ["^QFN-", 270]
      - ["^LQFP-", 270]
      - ["^TQFP-", 270]
      - ["^SOP-4_", 0]
      - ["^SOP-(?!18_)", 270]
      - ["^TSSOP-", 270]
      - ["^SSOP-", 270]
      - ["^DFN-", 270]
      - ["^SOIC-", 270]
      - ["^SOP-18_", 0]
      - ["^VSSOP-10_", 270]
      - ["^VSSOP-8_", 270]
      - ["^TSOP-6", 270]
      - ["^CP_EIA-", 180]
      - ["^CP_Elec_8x10.5", 180]
      - ["^CP_Elec_6.3x7.7", 180]
      - ["^CP_Elec_8x6.7", 180]
      - ["^CP_Elec_8x10", 180]
      - ["^CP_Elec_10x10", 180]
      - ["^(.*?_|V)?QFN-(16|20|24|28|40)(-|_|$)", 270]
      - ["^Bosch_LGA-8_2x2.5mm_P0.65mm_ClockwisePinNumbering", 90]
      - ["^PowerPAK_SO-8_Single", 270]
      - ["^HTSSOP-28-1EP_4.4x9.7mm*", 270]
      - ["^PUIAudio_SMT_0825_S_4_R*", 270]
      - ["^USB_C_Receptacle_HRO_TYPE-C-31-M-12*", 180]
      - ["ESP32-WROOM-32", 270]
      - ["^SOIC127P798X216-8N", -90]
      - ["^SW_DIP_SPSTx01_Slide_Copal_CHS-01B_W7.62mm_P1.27mm", -180]
      - ["^BatteryHolder_Keystone_1060_1x2032", -180]
      - ["^SO-14", -90]
      - ["^HTSSOP-", 270]
      - ["^USB_C_Receptacle_XKB_U262-16XN-4BVC11", 180]
      - ["^Relay_DPDT_Omron_G6K-2F-Y", 270]
      - ["^RP2040-QFN-56", 270]

outputs:
  - name: 'ibom'
    comment: "Interactive BOM"
    type: ibom
    dir: assembly
    options:
      output: '%f-ibom.%x'
      extra_fields: 'UST_ID'
      include_nets: true

  - name: 'netlist'
    comment: "KiCad netlist"
    type: netlist
    dir: assembly
    options:
      format: classic

  - name: 'netlist_ipc'
    comment: "IPC-D-356 netlist for the bare-board electrical test"
    type: netlist
    dir: assembly
    options:
      format: ipc

  - name: 'position'
    comment: "Pick and place, both sides in one file"
    type: position
    dir: assembly
    options:
      output: '%f-position.%x'
      format: CSV
      units: millimeters
      separate_files_for_front_and_back: false
      only_smd: false
      columns:
        - id: Ref
          name: Designator
        - Val
        - Package
        - id: PosX
          name: "Mid X"
        - id: PosY
          name: "Mid Y"
        - id: Rot
          name: Rotation
        - id: Side
          name: Layer

  - name: 'jlcpcb_bom'
    comment: "BOM for JLCPCB assembly (only parts with the LCSC field)"
    type: bom
    dir: assembly
    options:
      output: '%f-jlcpcb-bom.%x'
      format: CSV
      exclude_filter: jlcpcb_only_lcsc
      ref_separator: ','
      columns:
        - field: Value
          name: Comment
        - field: References
          name: Designator
        - Footprint
        - field: LCSC
          name: "LCSC Part #"
      csv:
        hide_pcb_info: true
        hide_stats_info: true
        quote_all: true

  - name: 'jlcpcb_cpl'
    comment: "Pick and place for JLCPCB assembly, rotations corrected for the JLCPCB library"
    type: position
    dir: assembly
    options:
      variant: jlcpcb_rotated
      output: '%f-jlcpcb-cpl.%x'
      format: CSV
      units: millimeters
      separate_files_for_front_and_back: false
      only_smd: false
      columns:
        - id: Ref
          name: Designator
        - id: PosX
          name: "Mid X"
        - id: PosY
          name: "Mid Y"
        - id: Side
          name: Layer
        - id: Rot
          name: Rotation
